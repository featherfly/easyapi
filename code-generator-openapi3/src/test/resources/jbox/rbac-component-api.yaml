openapi: 3.0.3
info:
  title: 组件接口定义
  description: >
     组件接口定义
  termsOfService: http://jbox.featherfly.cn/terms/
  contact:
    email: featherfly@foxmail.com
  version: 1.0.0
servers:
  - url: https://jbox.featherfly.cn/api/v1
  - url: http://jbox.featherfly.cn/api/v1
tags:
  - name: component
    description: 组件
paths:
  /component/platForm:
    get:
      tags:
        - component
      summary: 平台类型查询接口
      description: >
        平台类型查询接口
      operationId: getPlatForms
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformDto"
components:
  schemas:
    PlatformDto:
      description: 平台类型返回对象
      type: object
      properties:
        id:
          type: integer
          description: 主键id
        name:
          type: string
          description: 名称
        platform:
          items:
            $ref: "#/components/schemas/PlatformDto"